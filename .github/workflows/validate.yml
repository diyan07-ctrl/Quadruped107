name: Validate Pi and Uno runtime
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r Dev/Quadruped107-connect/python/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check Dev/Quadruped107-connect/assets/app.js
  uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli compile --profile uno Dev/Quadruped107-connect/sketch
