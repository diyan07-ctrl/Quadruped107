name: Validate Pi and Uno runtime
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_demo:
        type: boolean
        default: false
        description: Optional bounded offline simulation recording
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r software/pi/requirements-dev.txt -r simulation/requirements.txt -e software/pi
      - run: python -m pip check
      - run: python -m compileall -q software/pi/quadruped tests tools simulation
      - run: python simulation/build_model.py --check
      - run: python -m simulation.proxy_probe
      - run: python -m unittest discover -s tests -v
      - run: python -m simulation.validate
      - run: python -m simulation.model_study
      - name: Render bounded virtual gait recording
        if: github.event_name == 'workflow_dispatch' && inputs.record_demo
        run: python -m simulation.twin --headless --demo forward --arm-demo --steps 240 --record build/recordings/virtual-forward.avi --report build/recordings/virtual-forward.json
      - name: Upload virtual gait recording
        if: github.event_name == 'workflow_dispatch' && inputs.record_demo
        uses: actions/upload-artifact@v4
        with:
          name: quadruped107-phase3-simulation-video
          path: |
            build/recordings/virtual-forward.avi
            build/recordings/virtual-forward.json
          if-no-files-found: error

      - run: python tools/generate-motion-data.py --check
      - run: python hardware/Power/power_budget.py --check
      - run: python hardware/Power/power_budget.py --json
      - run: python -m pip wheel --no-deps software/pi -w build/wheels
      - run: python -m pip install --no-deps --force-reinstall build/wheels/*.whl
      - run: python tools/check-installed.py
      - run: sh -n deploy/install-virtual-pi.sh deploy/run-virtual-pi.sh
      - run: node --check software/pi/quadruped/web/app.js
      - run: node tools/check-repository.mjs
      - run: npm install --prefix build/mermaid --no-save mermaid@12.3.0 jsdom@26
      - run: node tools/check-mermaid.mjs
      - run: node tools/check-dashboard.mjs
      - run: git diff --exit-code
  uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: arduino/setup-arduino-cli@v2.0.0
      - run: arduino-cli core update-index
      - run: arduino-cli compile --profile uno firmware/uno/sketch
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python tools/generate-virtual-firmware.py
      - run: arduino-cli compile --profile uno build/virtual/sketch

  python313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r software/pi/requirements-dev.txt -e software/pi
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p test_vision_readiness.py -v
      - run: python -m unittest discover -s tests -p test_telemetry.py -v
      - run: python -m pip download --only-binary=:all: --platform manylinux_2_17_aarch64 --implementation cp --python-version 313 --abi cp313 --abi abi3 numpy opencv-python-headless==4.11.0.86 -d build/pi-wheels
